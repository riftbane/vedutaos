name: image

# Builds vedutaos.img from the pinned packages, boots the console on QEMU and drives it
# through the dashboard, a game and back. On a tag the image joins the release. Slow (the
# boot is emulated), so it runs on tags, by hand, and when what goes into the image changes.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["image/**", "initramfs/**", "cmd/**", "shell/**", "card/**", "panel/**", "install/**", "test/e2e/**", "go.mod", ".github/workflows/image.yml", ".github/demos.env"]
  pull_request:
    paths: ["image/**", "initramfs/**", "cmd/**", "shell/**", "card/**", "panel/**", "install/**", "test/e2e/**", "go.mod", ".github/workflows/image.yml", ".github/demos.env"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: tools for building and booting the image
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm xz-utils mtools

      - uses: actions/cache@v4
        with:
          path: cache/debs
          key: debs-${{ hashFiles('image/packages.go') }}

      - name: build the image
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          case "${GITHUB_REF}" in refs/tags/*) ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          go build -o out/vedutaos ./cmd/vedutaos
          # The demo games go onto the image's card, so a written card plays at once.
          . .github/demos.env
          engine="$(go list -m -f '{{.Version}}' github.com/riftbane/veduta)"
          git clone --quiet --depth 1 --branch "$engine" https://github.com/riftbane/veduta build/engine
          git clone --quiet --depth 1 --branch "$TINYCUBE_TAG" https://github.com/riftbane/tinycube build/tinycube
          ./out/vedutaos image --out out --cache cache --version "$version" --game build/engine/template --game build/tinycube
          ls -la out

      - name: boot it and play
        run: VEDUTAOS_E2E=1 go test ./test/e2e -timeout 60m -v

      - name: screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test/e2e/testdata/*.got.png
          if-no-files-found: ignore

      - name: pack
        run: |
          set -eu
          mkdir -p dist
          xz -T0 -c out/vedutaos.img > dist/vedutaos.img.xz
          cp out/vmlinuz out/initrd.img dist/
          (cd dist && sha256sum * > image-checksums.txt && cat image-checksums.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vedutaos-image
          path: dist/*
          retention-days: 14

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release workflow creates the release; wait for it rather than race it.
          for i in $(seq 1 60); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
