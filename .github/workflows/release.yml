name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  GOAMD64: v1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: release notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          mkdir -p build
          # The notes are the tag's section of CHANGELOG.md; a tag without one stops here,
          # before anything is built.
          awk -v head="## ${tag}" '
            index($0, head) == 1 && (length($0) == length(head) || substr($0, length(head) + 1, 1) == " ") { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > build/notes.md
          if ! grep -q '[^[:space:]]' build/notes.md; then
            echo "CHANGELOG.md has no section for ${tag}" >&2
            exit 1
          fi

      - name: test
        run: go test ./...

      - name: build archives
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          mkdir -p build dist
          # The console program runs on the boards, which are linux/arm64 every one; each
          # archive carries it beside the tool, which puts it on a card as a newer dashboard.
          # Nobody making a card needs Go.
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${tag}" -o build/vshell-arm64 ./cmd/vshell

          # The demo games: the engine's, from the engine release this repository builds
          # against, and TinyCube at its pinned tag, built for the console by the tool itself,
          # so a card can be tried with nothing but the archive.
          . .github/demos.env
          engine="$(go list -m -f '{{.Version}}' github.com/riftbane/veduta)"
          git clone --quiet --depth 1 --branch "$engine" https://github.com/riftbane/veduta build/engine
          git clone --quiet --depth 1 --branch "$TINYCUBE_TAG" https://github.com/riftbane/tinycube build/tinycube
          go run ./cmd/vedutaos card build/democard --game build/engine/template --game build/tinycube
          test -f build/democard/games/demo/card.json
          test -f build/democard/games/tinycube/card.json

          for target in windows/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="build/${os}_${arch}"
            mkdir -p "$stage/docs" "$stage/games"
            exe=vedutaos
            if [ "$os" = windows ]; then exe=vedutaos.exe; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${tag}" -o "$stage/$exe" ./cmd/vedutaos
            cp build/vshell-arm64 README.md CHANGELOG.md "$stage/"
            cp docs/*.md "$stage/docs/"
            cp -r build/democard/games/demo build/democard/games/tinycube "$stage/games/"
            name="vedutaos_${tag}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q -X -r "../../dist/${name}.zip" "$exe" vshell-arm64 README.md CHANGELOG.md docs games)
            else
              tar -C "$stage" -czf "dist/${name}.tar.gz" "$exe" vshell-arm64 README.md CHANGELOG.md docs games
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $pre --title "vedutaos ${GITHUB_REF_NAME}" --notes-file build/notes.md dist/*
